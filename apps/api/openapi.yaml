      parameters:
        - name: page
          required: false
          in: query
          description: Page number (1-based)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Number of items per page
          schema:
            default: 10
            example: 10
            type: number
        - name: sortField
          required: false
          in: query
          description: Field name to sort by
          schema:
            example: createdAt
            type: string
        - name: sortOrder
          required: false
          in: query
          schema:
            default: asc
            example: asc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          description: Full-text search keyword
          schema:
            example: ''
            type: string
        - name: searchIn
          required: false
          in: query
          description: Comma-separated field names to search within (e.g. name,symbol)
          schema:
            example: ''
            type: string
        - name: filters
          required: false
          in: query
          style: deepObject
          explode: true
          description: >-
            Structured filters. Example:
            filters[sku][$like]=sample-sku&filters[status][$eq]=DRAFT
          schema:
            type: object
            properties:
              sku:
                type: object
                description: Filter on `sku` (string)
                properties:
                  $eq:
                    type: string
                  $like:
                    type: string
                    example: sample-sku
                  $in:
                    type: array
                    items:
                      type: string
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $like: sample-sku
              status:
                type: object
                description: Filter on `status` (enum)
                properties:
                  $eq:
                    type: string
                    enum:
                      - DRAFT
                      - ACTIVE
                      - ARCHIVED
                    example: DRAFT
                  $in:
                    type: array
                    items:
                      type: string
                      enum:
                        - DRAFT
                        - ACTIVE
                        - ARCHIVED
                  $isNull:
                    type: boolean
                    enum:
                      - true
                example:
                  $eq: DRAFT
            example:
              sku:
                $like: sample-sku
              status:
                $eq: DRAFT
      responses:
        '200':
          description: Paginated success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessResponseDto'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ItemResponseDto'
                      meta:
                        type: object
                        properties:
                          pagination:
                            type: object
                            properties:
                              total:
                                type: number
                                example: 0
                              page:
                                type: number
                                example: 1
                              limit:
                                type: number
                                example: 10
                              totalPages:
                                type: number
                                example: 0
                          filterOptions:
                            type: array
                            example:
                              - field: sku
                                type: string
                                operators:
                                  - $eq
                                  - $like
                                  - $in
                                  - $isNull
                              - field: status
                                type: enum
                                operators:
                                  - $eq
                                  - $in
                                  - $isNull
                                enumValues:
                                  - DRAFT
                                  - ACTIVE
                                  - ARCHIVED
        '401':
          description: JWT token is missing, expired, or invalid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiErrorResponseDto'
                example:
                  status: error
                  message: Unauthorized
                  data: null
                  error:
                    code: UNAUTHORIZED
                    message: JWT token is missing, expired, or invalid
        '403':
          description: Insufficient permissions to perform this action
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiErrorResponseDto'
                example:
                  status: error
                  message: Forbidden
                  data: null
                  error:
                    code: FORBIDDEN
                    message: Insufficient permissions to perform this action
        '404':
          description: The requested resource was not found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiErrorResponseDto'
                example:
                  status: error
                  message: Not found
                  data: null
                  error:
                    code: NOT_FOUND
                    message: The requested resource was not found
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiErrorResponseDto'
                example:
                  status: error
                  message: Validation failed
                  data: null
                  error:
                    code: VALIDATION_ERROR
                    message: Validation failed
                    details:
                      - field: email
                        message: email must be a valid email address
                        code: isEmail
        '500':
          description: An unexpected internal server error occurred
          content:
