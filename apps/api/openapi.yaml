info:
  title: Platform Core API
  description: Platform Core API documentation
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    JWT-auth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: JWT
      in: header
  schemas:
    PasswordCredentialsDto:
      type: object
      properties:
        email:
          type: string
          example: ada@example.com
        phone:
          type: string
          example: '+15551212000'
        password:
          type: string
          example: correct horse
      required:
        - password
    SessionRoleDto:
      type: object
      properties:
        slug:
          type: string
          example: owner
        label:
          type: object
          additionalProperties:
            type: string
          example:
            en: Owner
      required:
        - slug
        - label
    SessionUserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
          example: ada@example.com
        phone:
          type: string
          nullable: true
          example: '+15551212000'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SessionRoleDto'
      required:
        - id
        - email
        - phone
        - roles
    SessionResponseDto:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Registered
        data:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/SessionUserDto'
      required:
        - status
        - message
        - data
    OtpRequestDto:
      type: object
      properties:
        email:
          type: string
          example: ada@example.com
        phone:
          type: string
          example: '+15551212000'
    OtpVerifyDto:
      type: object
      properties:
        email:
          type: string
          example: ada@example.com
        phone:
          type: string
          example: '+15551212000'
        code:
          type: string
          example: '123456'
      required:
        - code
    RoleLabelDto:
      type: object
      properties:
        ar:
          type: string
          example: كاتب
        en:
          type: string
          example: Clerk
      required:
        - ar
        - en
    CreateRoleDto:
      type: object
      properties:
        slug:
          type: string
          example: clerk
        label:
          $ref: '#/components/schemas/RoleLabelDto'
        permissions:
          example:
            - users.read
          type: array
          items:
            type: string
      required:
        - slug
        - label
        - permissions
    RoleViewDto:
      type: object
      properties:
        slug:
          type: string
          example: clerk
        label:
          type: object
          additionalProperties:
            type: string
          example:
            ar: كاتب
            en: Clerk
        permissions:
          example:
            - users.read
          type: array
